# Alembic configuration for FinanceFlow
# The real DATABASE_URL is loaded from env.py via app.core.config so that
# the same .env file drives the app and the migrations.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# These are read by env.py (which prefers app.core.config settings.DATABASE_URL).
# They are kept here as a fallback for tooling that doesn't import our app.
sqlalchemy.url = mysql+pymysql://financeflow:change_me_in_production@127.0.0.1:3306/financeflow?charset=utf8mb4

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
